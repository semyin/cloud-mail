<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>邮件显示安全检查</title>
<style>body{font:16px/1.6 system-ui;margin:30px;max-width:950px}#results{padding:12px;background:#eef5ff}button{margin:10px 0;padding:8px 14px}#app{border:1px solid #ccc;padding:16px}</style>
</head><body>
<h1>邮件显示安全检查</h1>
<p>只使用本机生成的测试内容，不连接真实邮箱。</p>
<p id="execution">危险程序：未执行</p>
<div id="results">正在读取本机请求计数</div>
<div id="app"></div>
<script type="module">
import { createApp, h, ref } from 'vue'
import { createI18n } from 'vue-i18n'
import EmailBody from '../src/components/shadow-html/index.vue'

const probe = 'http://127.0.0.1:3101/__email_security_probe__/'
const sample = `<html><head><style>p.tracker{background-image:url(${probe}css)}</style></head><body>
  <h2>普通邮件排版</h2><p class="tracker">文字、表格、链接应能正常阅读。</p>
  <table style="border-collapse:collapse;width:100%"><tr><th>项目</th><th>结果</th></tr><tr><td>邮件正文</td><td><strong>保持可读</strong></td></tr></table>
  <p><a href="https://example.com" target="_top" ping="${probe}script">普通链接</a></p>
  <img src="${probe}image" alt="测试图片">
  <img src="${probe}broken" onerror="fetch('${probe}script');parent.document.querySelector('#execution').textContent='危险程序：已执行'">
  <svg onload="fetch('${probe}script')"></svg>
  <script>fetch('${probe}script')<\/script>
  </body></html>`
createApp({
  setup() {
    const mail = ref(sample)
    return () => [
      h('button', { onClick: () => { mail.value = sample.replace('普通邮件排版', '另一封测试邮件') } }, '切换到另一封测试邮件'),
      h(EmailBody, { html: mail.value })
    ]
  }
}).use(createI18n({ legacy: false, locale: 'zh', messages: { zh: {
  emailBody: '邮件正文', emailImagesBlocked: '图片已隐藏，只有点击后才加载。', showEmailImages: '显示邮件图片'
} } })).mount('#app')
async function refreshCounts() {
  const counts = await (await fetch('/__email_security_results__')).json()
  document.querySelector('#results').textContent = `图片请求：${counts.image}；背景图片请求：${counts.css}；破损图片请求：${counts.broken}；危险程序请求：${counts.script}`
}
refreshCounts()
setInterval(refreshCounts, 1000)
</script>
</body></html>
